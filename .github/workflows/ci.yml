name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release creation needs it; new repos default to read-only

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Separate venvs: the HA test harness registers a pytest plugin (via
      # entry point) whose autouse async fixtures break plain sync tests.
      - name: Unit tests
        run: |
          python -m venv /tmp/unit
          /tmp/unit/bin/pip install -q -r tests/unit/requirements.txt
          cd tests/unit && /tmp/unit/bin/pytest -q
      - name: HA core tests
        run: |
          python -m venv /tmp/ha
          /tmp/ha/bin/pip install -q -r tests/ha/requirements.txt
          cd tests/ha && /tmp/ha/bin/pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Card tests
        run: cd tests/card && npm install && npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build (ESP-IDF v6.0, esp32c3) and run the core's host tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32c3
          command: >-
            idf.py build &&
            (cd build && esptool --chip esp32c3 merge-bin -o control_panel-factory.bin @flash_args) &&
            (cd test/host && env -u IDF_TARGET idf.py --preview set-target linux reconfigure) &&
            test/host/run_plain.sh

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/control_panel.bin
            build/control_panel-factory.bin

      - name: Package HACS zip (integration + matching firmware)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo chown -R "$(id -u)" build
          scripts/release_firmware.sh
          cd custom_components/control_panel && zip -qr "$GITHUB_WORKSPACE/control_panel.zip" . -x '__pycache__/*'

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/control_panel.bin
            build/control_panel-factory.bin
            control_panel.zip
